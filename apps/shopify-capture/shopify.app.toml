# Klyna Capture — app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder — `shopify app config link` rewrites this with your real client_id.
client_id = "REPLACE_WITH_CLIENT_ID_FROM_PARTNER_DASHBOARD"

name = "Klyna Capture"
handle = "shopify-capture"
application_url = "https://klyna.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

# Capture writes opt-ins straight to Shopify customers with email/SMS marketing
# consent, so it needs write access to customers. read_products/read_themes let
# the popup builder mirror store branding and target collection/product pages.
[access_scopes]
scopes = "read_customers,write_customers,read_products,read_themes"

[auth]
redirect_urls = [
  "https://klyna.dev/auth/callback",
  "https://klyna.dev/auth/shopify/callback",
  "https://klyna.dev/api/auth/callback"
]

# Storefront ↔ app bridge. The theme app embed calls these signed proxy paths:
#   /apps/klyna-capture/config   → app `/proxy/config`   (active campaigns)
#   /apps/klyna-capture/capture  → app `/proxy/capture`  (record an opt-in)
#   /apps/klyna-capture/event    → app `/proxy/event`    (impression/dismiss)
[app_proxy]
url = "https://klyna.dev/proxy"
prefix = "apps"
subpath = "klyna-capture"

[pos]
embedded = false
