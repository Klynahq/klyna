# Klyna Feed — theme app extension.
#
# Adds an app block merchants can drop onto the product template. It renders an
# "Also available on" channel strip (Google / Meta / TikTok / Pinterest) and,
# optionally, a Product JSON-LD block that mirrors the same fields Klyna puts in
# the feed — so the product carries consistent structured data on-page and in
# the syndicated feed.

api_version = "2026-04"

[[extensions]]
name = "Klyna Feed badge"
handle = "klyna-feed-badge"
uid = "24aa4314-0262-27f7-dea4-b7005af7276bc87d4521"
type = "theme"
