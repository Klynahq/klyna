<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Performance Audit: The First Five Minutes That Matter visual 2</title>
  <desc id="desc">A structured Klyna audit diagram for shopify performance audit.</desc>
  <rect width="1280" height="720" fill="#080b12"/>
  <rect x="54" y="54" width="1172" height="612" rx="28" fill="#111827" stroke="#263244" stroke-width="2"/>
  <text x="92" y="128" fill="#14b8a6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Klyna audit map</text>
  <text x="92" y="180" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">shopify performance audit</text>
  <text x="92" y="225" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">verify before install</text>
  <g>
    <rect x="92" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="128" cy="346" r="18" fill="#14b8a6"/>
    <text x="122" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">1</text>
    <text x="120" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Open mobile first</text>
    <foreignObject x="120" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Review the homepage, one collection, one product, and the cart path on a real viewport.</div>
    </foreignObject>
  </g>
<g>
    <rect x="378" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="414" cy="346" r="18" fill="#14b8a6"/>
    <text x="408" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">2</text>
    <text x="406" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">List app jobs</text>
    <foreignObject x="406" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Separate reviews, upsells, popups, subscriptions, tracking, feeds, page builders, and speed tools.</div>
    </foreignObject>
  </g>
<g>
    <rect x="664" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="700" cy="346" r="18" fill="#14b8a6"/>
    <text x="694" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="692" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Check duplicate signals</text>
    <foreignObject x="692" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Look for duplicate pixels, duplicate schema, duplicate app widgets, and repeated scripts.</div>
    </foreignObject>
  </g>
<g>
    <rect x="950" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="986" cy="346" r="18" fill="#14b8a6"/>
    <text x="980" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">4</text>
    <text x="978" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Pick one fix</text>
    <foreignObject x="978" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">The first pass should end with the next safest change, not a giant backlog nobody will ship.</div>
    </foreignObject>
  </g>
  <text x="92" y="610" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Outcome: a safer Shopify fix path for humans, search engines, and AI answers.</text>
</svg>
