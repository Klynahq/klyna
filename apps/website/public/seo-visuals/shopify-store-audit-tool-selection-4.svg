<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Store Audit Tool Selection: What to Check Before Installing visual 4</title>
  <desc id="desc">A structured Klyna audit diagram for shopify store audit tool.</desc>
  <rect width="1280" height="720" fill="#080b12"/>
  <rect x="54" y="54" width="1172" height="612" rx="28" fill="#111827" stroke="#263244" stroke-width="2"/>
  <text x="92" y="128" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Klyna audit map</text>
  <text x="92" y="180" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">shopify store audit tool</text>
  <text x="92" y="225" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">ship one safe fix</text>
  <g>
    <rect x="92" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="128" cy="346" r="18" fill="#38bdf8"/>
    <text x="122" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">1</text>
    <text x="120" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Access scope</text>
    <foreignObject x="120" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">The tool should explain what it reads, what it stores, and whether it makes write actions.</div>
    </foreignObject>
  </g>
<g>
    <rect x="378" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="414" cy="346" r="18" fill="#38bdf8"/>
    <text x="408" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">2</text>
    <text x="406" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Fix mapping</text>
    <foreignObject x="406" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Every issue should map to a storefront page, theme file, catalog field, tracking source, or redirect rule.</div>
    </foreignObject>
  </g>
<g>
    <rect x="664" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="700" cy="346" r="18" fill="#38bdf8"/>
    <text x="694" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="692" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Rollback posture</text>
    <foreignObject x="692" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Theme and tracking changes need preview, backup, and a clear rollback note.</div>
    </foreignObject>
  </g>
<g>
    <rect x="950" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="986" cy="346" r="18" fill="#38bdf8"/>
    <text x="980" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">4</text>
    <text x="978" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Report usefulness</text>
    <foreignObject x="978" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">A good report prioritizes the next safe fix, not a long list of generic warnings.</div>
    </foreignObject>
  </g>
  <text x="92" y="610" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Outcome: a safer Shopify fix path for humans, search engines, and AI answers.</text>
</svg>
