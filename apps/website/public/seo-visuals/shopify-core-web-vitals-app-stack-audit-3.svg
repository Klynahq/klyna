<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Shopify Core Web Vitals App Stack Audit visual 3</title>
  <desc id="desc">A structured Klyna audit diagram for shopify core web vitals app stack.</desc>
  <rect width="1280" height="720" fill="#080b12"/>
  <rect x="54" y="54" width="1172" height="612" rx="28" fill="#111827" stroke="#263244" stroke-width="2"/>
  <text x="92" y="128" fill="#f59e0b" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Klyna audit map</text>
  <text x="92" y="180" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">shopify core web vitals app stack</text>
  <text x="92" y="225" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">protect conversion</text>
  <g>
    <rect x="92" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="128" cy="346" r="18" fill="#f59e0b"/>
    <text x="122" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">1</text>
    <text x="120" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Largest content</text>
    <foreignObject x="120" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Hero media, product images, fonts, and above-the-fold app blocks can affect perceived speed.</div>
    </foreignObject>
  </g>
<g>
    <rect x="378" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="414" cy="346" r="18" fill="#f59e0b"/>
    <text x="408" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">2</text>
    <text x="406" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Interaction delay</text>
    <foreignObject x="406" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Heavy app scripts, cart widgets, popups, and analytics can delay taps and input response.</div>
    </foreignObject>
  </g>
<g>
    <rect x="664" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="700" cy="346" r="18" fill="#f59e0b"/>
    <text x="694" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="692" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Layout shifts</text>
    <foreignObject x="692" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Review badges, sticky bars, recommendation widgets, and late-loading banners can shift product content.</div>
    </foreignObject>
  </g>
<g>
    <rect x="950" y="300" width="248" height="240" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="986" cy="346" r="18" fill="#f59e0b"/>
    <text x="980" y="354" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">4</text>
    <text x="978" y="402" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Template spread</text>
    <foreignObject x="978" y="426" width="190" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font:18px/1.35 Arial,sans-serif;color:#94a3b8;">Check homepage, product, collection, blog, cart, and campaign templates instead of one URL.</div>
    </foreignObject>
  </g>
  <text x="92" y="610" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="20">Outcome: a safer Shopify fix path for humans, search engines, and AI answers.</text>
</svg>
