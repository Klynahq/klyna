<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Choose the offer before the app - Klyna Bundles</title>
  <desc id="desc">Four bundle jobs that should not be treated as one</desc>
  <rect width="1280" height="720" fill="#0b0b0f"/>
  <rect x="48" y="48" width="1184" height="624" rx="8" fill="#13131a" stroke="#2a2a35" stroke-width="2"/>
  <rect x="84" y="82" width="42" height="42" rx="8" fill="#7c5cff"/>
  <text x="105" y="111" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">K</text>
  <text x="144" y="110" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Klyna Bundles</text>
  <text x="84" y="184" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800"><tspan x="84" dy="0">Choose the offer before the app</tspan></text>
  <text x="84" y="278" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500"><tspan x="84" dy="0">Four bundle jobs that should not be treated as one</tspan></text>
  <g>
      <rect x="84" y="372" width="249" height="202" rx="8" fill="#1a1a23" stroke="#2a2a35" stroke-width="2"/>
