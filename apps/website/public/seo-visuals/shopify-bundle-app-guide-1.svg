      <text x="104" y="470" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750"><tspan x="104" dy="0">Fixed</tspan></text>
      <text x="104" y="526" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="104" dy="0">A predetermined set</tspan></text>
    </g>
<g>
      <rect x="365" y="372" width="249" height="202" rx="8" fill="#1a1a23" stroke="#2a2a35" stroke-width="2"/>
      <rect x="385" y="394" width="34" height="34" rx="8" fill="#7c5cff"/>
      <text x="402" y="418" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">2</text>
      <text x="385" y="470" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750"><tspan x="385" dy="0">Multipack</tspan></text>
      <text x="385" y="526" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="385" dy="0">More of one product</tspan></text>
    </g>
<g>
      <rect x="646" y="372" width="249" height="202" rx="8" fill="#1a1a23" stroke="#2a2a35" stroke-width="2"/>
      <rect x="666" y="394" width="34" height="34" rx="8" fill="#7c5cff"/>
      <text x="683" y="418" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">3</text>
      <text x="666" y="470" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750"><tspan x="666" dy="0">Mix-and-match</tspan></text>
      <text x="666" y="526" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="666" dy="0">Shopper chooses items</tspan></text>
    </g>
<g>
      <rect x="927" y="372" width="249" height="202" rx="8" fill="#1a1a23" stroke="#2a2a35" stroke-width="2"/>
