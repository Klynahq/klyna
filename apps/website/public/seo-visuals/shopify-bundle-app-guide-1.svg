      <text x="947" y="470" fill="#f4f4f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750"><tspan x="947" dy="0">Quantity break</tspan></text>
      <text x="947" y="526" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="947" dy="0">Price changes by quantity</tspan></text>
