<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lightweight WordPress SEO plugin stack</title>
  <desc id="desc">A simple WordPress SEO plugin stack showing metadata, schema, internal links, freshness, and redirects without extra bloat.</desc>
  <rect width="1200" height="675" fill="#0b1120"/>
  <text x="85" y="110" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Lightweight WordPress SEO stack</text>
  <text x="85" y="155" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="22">Keep the plugin focused on the jobs that affect crawl, clicks, and trust</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="105" y="240" width="990" height="78" rx="16" fill="#172554" stroke="#60a5fa"/>
    <text x="145" y="291" fill="#dbeafe" font-size="24">Metadata and canonical checks</text>
    <rect x="105" y="335" width="990" height="78" rx="16" fill="#14532d" stroke="#86efac"/>
    <text x="145" y="386" fill="#dcfce7" font-size="24">Schema that matches visible content</text>
    <rect x="105" y="430" width="990" height="78" rx="16" fill="#581c87" stroke="#c084fc"/>
    <text x="145" y="481" fill="#f3e8ff" font-size="24">Internal links and orphan-page recovery</text>
    <rect x="105" y="525" width="990" height="78" rx="16" fill="#7c2d12" stroke="#fdba74"/>
    <text x="145" y="576" fill="#ffedd5" font-size="24">Freshness, redirects, and GSC follow-up</text>
  </g>
</svg>
