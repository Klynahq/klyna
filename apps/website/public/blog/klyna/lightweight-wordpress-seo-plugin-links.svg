<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WordPress internal link map</title>
  <desc id="desc">A map showing how WordPress SEO plugins should connect money pages, support posts, FAQs, and product pages.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="90" y="105" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Internal links should have a job</text>
  <text x="90" y="150" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="22">Klyna links support pages into product and conversion paths</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="600" cy="340" r="95" fill="#1d4ed8" stroke="#93c5fd" stroke-width="4"/>
    <text x="600" y="335" fill="#ffffff">Core</text>
    <text x="600" y="365" fill="#ffffff">product page</text>
    <circle cx="290" cy="210" r="80" fill="#047857" stroke="#86efac" stroke-width="4"/>
    <text x="290" y="216" fill="#ffffff">Guide</text>
    <circle cx="910" cy="210" r="80" fill="#7c3aed" stroke="#c4b5fd" stroke-width="4"/>
    <text x="910" y="216" fill="#ffffff">FAQ</text>
    <circle cx="290" cy="500" r="80" fill="#c2410c" stroke="#fdba74" stroke-width="4"/>
    <text x="290" y="506" fill="#ffffff">Comparison</text>
    <circle cx="910" cy="500" r="80" fill="#be123c" stroke="#fb7185" stroke-width="4"/>
    <text x="910" y="506" fill="#ffffff">Download</text>
  </g>
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round">
    <path d="M365 245 512 306"/>
    <path d="M835 245 688 306"/>
    <path d="M365 472 512 384"/>
    <path d="M835 472 688 384"/>
  </g>
</svg>
