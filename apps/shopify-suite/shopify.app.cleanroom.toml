# Klyna Cleanroom public app config.
# Link this file to the matching Shopify Partners app with:
#   pnpm config:link -- --config shopify.app.cleanroom.toml

client_id = "c007b5b0d8fc7f4105e29c4ca2c5d5f6"
name = "Klyna Cleanroom"
application_url = "https://klyna-cleanroom.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_products,read_content,read_themes"

[auth]
redirect_urls = [
  "https://klyna-cleanroom.vercel.app/auth/callback",
  "https://klyna-cleanroom.vercel.app/auth/shopify/callback",
  "https://klyna-cleanroom.vercel.app/api/auth/callback",
  "https://klyna-cleanroom.vercel.app/auth/login",
]
