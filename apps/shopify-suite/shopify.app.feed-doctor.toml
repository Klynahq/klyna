# Klyna Feed Doctor public app config.
# Link this file to the matching Shopify Partners app with:
#   pnpm config:link -- --config shopify.app.feed-doctor.toml

client_id = "521ab3247994ae2e5ac0567c7622bae0"
name = "Klyna Feed Doctor"
application_url = "https://klyna-feed-doctor.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://klyna-feed-doctor.vercel.app/auth/callback",
  "https://klyna-feed-doctor.vercel.app/auth/shopify/callback",
  "https://klyna-feed-doctor.vercel.app/api/auth/callback",
  "https://klyna-feed-doctor.vercel.app/auth/login",
]
