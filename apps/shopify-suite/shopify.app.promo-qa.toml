# Klyna Promo QA public app config.
# Link this file to the matching Shopify Partners app with:
#   pnpm config:link -- --config shopify.app.promo-qa.toml

client_id = "e22ec396a32d0e883cc3505901e6cd67"
name = "Klyna Promo QA"
application_url = "https://klyna-promo-qa.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_products,read_discounts"

[auth]
redirect_urls = [
  "https://klyna-promo-qa.vercel.app/auth/callback",
  "https://klyna-promo-qa.vercel.app/auth/shopify/callback",
  "https://klyna-promo-qa.vercel.app/api/auth/callback",
  "https://klyna-promo-qa.vercel.app/auth/login",
]
