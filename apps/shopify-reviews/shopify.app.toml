# Klyna Reviews — app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder — `shopify app config link` rewrites this with your real client_id.
client_id = "de9d1c425289b2900e2b8ef5392b3f79"

name = "Klyna Reviews"
handle = "klyna-reviews"
application_url = "https://klyna-shopify-reviews.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true
dev_store_url = ""

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Drives review-request email automation: when an order is fulfilled we
  # schedule a request to the customer for the products they bought.
  [[webhooks.subscriptions]]
  topics = ["orders/fulfilled"]
  uri = "/webhooks/orders/fulfilled"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[access_scopes]
# read_products      — resolve product titles/handles/images for the widget + emails
# read_orders        — match fulfillments to line items for review requests
# read_customers     — name + email for review-request automation
# write_metafields   — publish aggregate rating metafields the storefront widget reads
scopes = "read_products,read_orders,read_customers,write_metafields"

[auth]
redirect_urls = [
  "https://klyna-shopify-reviews.vercel.app/auth/callback",
  "https://klyna-shopify-reviews.vercel.app/auth/shopify/callback",
  "https://klyna-shopify-reviews.vercel.app/api/auth/callback"
]

[pos]
embedded = false
