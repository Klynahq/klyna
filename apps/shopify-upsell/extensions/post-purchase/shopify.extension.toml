# Klyna Upsell — post-purchase offer (Checkout UI extension scaffold).
#
# Renders a one-click upsell on the post-purchase page, immediately after
# checkout completes. Activate it in the admin under
# Settings → Checkout → Post-purchase page, then select "Klyna Upsell".
#
# NOTE: post-purchase extensions require the extension build toolchain
# (`@shopify/post-purchase-ui-extensions-react`). This scaffold wires the
# offer-fetch + accept flow against the same /api/offers endpoint the cart
# widget uses; run `shopify app dev` to build and preview it.

api_version = "2026-04"

[[extensions]]
name = "Klyna Upsell — Post-purchase"
handle = "klyna-upsell-post-purchase"
uid = "3f7d5b8f-a116-4ec1-580f-2c9bccad6bd7c2f7e464"
type = "checkout_post_purchase"
# No custom metafields required; offers are fetched from the app at runtime.
