# Klyna Upsell — in-cart theme app extension.
#
# Renders the cart upsell widget. Merchants add the "Klyna Upsell" block to
# their cart drawer / cart page from the theme editor; no theme code required.

api_version = "2025-01"

[[extensions]]
name = "Klyna Upsell"
handle = "klyna-upsell"
type = "theme"
