# Klyna Bundles - app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder - `shopify app config link` rewrites this with your real client_id.
client_id = "08d624eacf014ae9ee9ffe44f5a6bf62"

name = "Klyna Bundles"
handle = "klyna-bundles"
application_url = "https://klyna-bundles.vercel.app/app"
embedded = true

[access_scopes]
# read_products - read the catalog for the builder and storefront offer lookup.
# read_discounts / write_discounts - create and manage the volume-break and
#   bundle automatic discounts.
scopes = "read_products,read_discounts,write_discounts"

# App proxy - exposes the public storefront data endpoint at
# https://<shop>/apps/klyna-bundles, forwarded to /api/storefront. The theme
# app extension calls this to render bundle and volume-tier data on the product page.
[app_proxy]
url = "https://klyna-bundles.vercel.app/api/storefront"
subpath = "klyna-bundles"
prefix = "apps"

[auth]
redirect_urls = [
  "https://klyna-bundles.vercel.app/auth/callback",
  "https://klyna-bundles.vercel.app/auth/shopify/callback",
  "https://klyna-bundles.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = false
