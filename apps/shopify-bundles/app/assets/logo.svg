<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Klyna Bundles">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9277ff"/>
      <stop offset="100%" stop-color="#5b3df0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#g)"/>
  <!-- Three stacked rounded squares — a bundle. -->
  <rect x="7" y="7" width="11" height="11" rx="2.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="10.5" y="10.5" width="11" height="11" rx="2.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="14" y="14" width="11" height="11" rx="2.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
