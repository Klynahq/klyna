# Local WordPress test environment for the Klyna SEO Suite plugin.
# Brings up WordPress 6.7 + MySQL 8.0 with the plugin mounted into the
# wp-content/plugins directory so any code edit is immediately live.
#
#   docker compose up -d         # start (first time ~1-2 min to pull images)
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop AND wipe the database/uploads
#   docker compose logs -f wp    # follow WordPress logs

services:
  db:
    image: mysql:8.0
    container_name: klyna-wp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  wp:
    image: wordpress:6.7-php8.3-apache
    container_name: klyna-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    volumes:
      # Live-mount the plugin source — code edits are instant, no rebuild.
      - .:/var/www/html/wp-content/plugins/klyna-seo-suite
      # Persistent uploads + WordPress core
      - wp_data:/var/www/html

  # WP-CLI sidecar for scripted install + plugin activation.
  # Run with:  docker compose run --rm wpcli wp <command>
  wpcli:
    image: wordpress:cli-2.11-php8.3
    container_name: klyna-wp-cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wp:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/klyna-seo-suite
    profiles: ["cli"]
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
