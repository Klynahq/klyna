# Klyna Sticky Cart — app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder — `shopify app config link` rewrites this with your real client_id.
client_id = "REPLACE_WITH_CLIENT_ID_FROM_PARTNER_DASHBOARD"

name = "Klyna Sticky Cart"
handle = "shopify-sticky-cart"
application_url = "https://klyna.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

# read_products  — load product/variant data for the bar + analytics labels.
# write_metaobjects / read_metaobjects — persist storefront widget settings as a
#   shop-owned metaobject so the theme app extension can read them via App Proxy.
[access_scopes]
scopes = "read_products,read_metaobjects,write_metaobjects"

[auth]
redirect_urls = [
  "https://klyna.dev/auth/callback",
  "https://klyna.dev/auth/shopify/callback",
  "https://klyna.dev/api/auth/callback"
]

# App Proxy — the storefront theme block fetches live settings + posts click
# analytics through this signed proxy (no CORS, no public token needed).
[app_proxy]
url = "https://klyna.dev/proxy"
subpath = "sticky-cart"
prefix = "apps"

[pos]
embedded = false
