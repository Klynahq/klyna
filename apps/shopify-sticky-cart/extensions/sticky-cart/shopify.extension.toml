# Klyna Sticky Cart — Theme App Extension.
#
# Ships the storefront widget as an *app embed* block. Merchants enable it once
# under Online Store → Themes → Customize → App embeds; it then renders on every
# product page with no theme code changes.

api_version = "2026-04"

[[extensions]]
name = "Klyna Sticky Cart"
handle = "sticky-cart"
uid = "0e5c21e3-848b-99ca-a71e-bd2d139248a0c003d372"
type = "theme"

  [extensions.capabilities]
  block_only = false
