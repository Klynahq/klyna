# Klyna Urgency — app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder — `shopify app config link` rewrites this with your real client_id.
client_id = "570b92e0a46f613063a6ef2ef1d25680"

name = "Klyna Urgency"
handle = "klyna-urgency"
application_url = "https://klyna-urgency.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true
dev_store_url = ""

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

# Scarcity & social-proof need products, inventory levels, and orders.
[access_scopes]
scopes = "read_products,read_inventory,read_orders"

[auth]
redirect_urls = [
  "https://klyna-urgency.vercel.app/auth/callback",
  "https://klyna-urgency.vercel.app/auth/shopify/callback",
  "https://klyna-urgency.vercel.app/api/auth/callback"
]

[pos]
embedded = false
