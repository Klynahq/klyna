# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ce967ef55bafcdeb9823498ffedb17c7"
name = "Klyna Wishlist"
application_url = "https://klyna-wishlist.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_products"

[auth]
redirect_urls = [
  "https://klyna-wishlist.vercel.app/auth/callback",
  "https://klyna-wishlist.vercel.app/auth/shopify/callback",
  "https://klyna-wishlist.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[build]
automatically_update_urls_on_dev = true
