# Klyna Back-in-Stock - app config.
#
# To use this app:
#   1. Create a Shopify Partner account at https://partners.shopify.com
#   2. Run `shopify app config link` from this folder to bind it to your Partner app.
#      The CLI will overwrite `client_id` below with your actual app key.
#   3. Run `pnpm dev` (or `shopify app dev`) to start the embedded app on your dev store.

# Placeholder - `shopify app config link` rewrites this with your real client_id.
client_id = "39090fee679968ddbfe1cce940c10656"

name = "Klyna Back-in-Stock"
handle = "klyna-back-in-stock"
application_url = "https://klyna-shopify-restock.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false
dev_store_url = ""
include_config_on_deploy = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Fired whenever a variant's available count changes at a location. This is the
  # signal that drives back-in-stock alerts: when a sold-out variant goes > 0 we
  # flush its waitlist.
  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "/webhooks/inventory/update"

  # Keeps the cached variant title / product handle fresh for the storefront
  # widget and the demand report.
  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  # Mandatory GDPR / App Store compliance webhooks.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[access_scopes]
# read_products + read_inventory power the demand report and the inventory webhook.
scopes = "read_products,read_inventory"

[auth]
redirect_urls = [
  "https://klyna-shopify-restock.vercel.app/auth/callback",
  "https://klyna-shopify-restock.vercel.app/auth/shopify/callback",
  "https://klyna-shopify-restock.vercel.app/api/auth/callback"
]

[pos]
embedded = false
