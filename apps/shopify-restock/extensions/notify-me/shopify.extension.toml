# Klyna Back-in-Stock — Theme App Extension.
#
# Ships the storefront "Notify me" widget as an app block merchants drop into
# their product template (Online Store → Themes → Customize → Add block → Apps).
# The block renders only when the selected variant is sold out, captures
# email interest, and POSTs it to the app's /api/subscribe endpoint.

api_version = "2026-04"

[[extensions]]
name = "Klyna Notify me"
handle = "notify-me"
uid = "3c1b2503-4b5c-a569-f4a8-8fd1c433c12cbdd3d72d"
type = "theme"
