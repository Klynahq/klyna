# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "689f54104880dea52bb1ab357740266c"
name = "Klyna SEO Clean"
application_url = "https://klyna-seo.vercel.app"
embedded = true
handle = "klyna-seo-clean"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://klyna-seo.vercel.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://klyna-seo.vercel.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://klyna-seo.vercel.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://klyna-seo.vercel.app/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_metaobjects,read_products,read_themes,write_content,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://klyna-seo.vercel.app/auth/callback",
  "https://klyna-seo.vercel.app/auth/shopify/callback",
  "https://klyna-seo.vercel.app/api/auth/callback",
  "https://klyna-seo.vercel.app/auth/login"
]
